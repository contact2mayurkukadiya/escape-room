<h1 mat-dialog-title>{{data['question']}}</h1>
<div mat-dialog-content>
    <!-- <p>{{data['question']}}</p> -->
    <div class="answer-div">
        <div class="mt-3" *ngFor="let option of data['answer_array']" style="margin: 1rem;width: 100%;">
            <button (click)="pickAnswer(option)" type="button" class="option-btn" style="width:100%;height: 2rem;">
                <div class="mr-3 font-weight-normal">
                    {{option}}
                </div>
            </button>
        </div>
    </div>
</div>
<div mat-dialog-actions style="justify-content: center;">
    <button mat-button class="submit-btn" (click)="save()" cdkFocusInitial>Select</button>
</div>
